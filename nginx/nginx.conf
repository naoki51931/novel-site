events {}

http {
    map $http_user_agent $is_search_bot {
        default 0;
        ~*(googlebot|google-inspectiontool|bingbot|slurp|duckduckbot|yandexbot|baiduspider) 1;
    }

    client_max_body_size 10M;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Docker 内 DNS を利用して upstream を定期再解決
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    # ================================
    # HTTP → HTTPS redirect
    # ================================
    server {
        listen 80;
        server_name _
            shosetsu-toukou-site.org
            www.shosetsu-toukou-site.org
            renai.shosetsu-toukou-site.org
            rekishi.shosetsu-toukou-site.org
            lexis-novel-site.org
            www.lexis-novel-site.org
            renai.lexis-novel-site.org
            rekishi.lexis-novel-site.org;

        # Certbot HTTP-01 challenge must be served over plain HTTP.
        location /.well-known/acme-challenge/ {
            alias /var/www/certbot/.well-known/acme-challenge/;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ================================
    # HTTPS 本番サーバー
    # ================================
    server {
        listen 443 ssl;
        server_name _
            shosetsu-toukou-site.org
            www.shosetsu-toukou-site.org
            renai.shosetsu-toukou-site.org
            rekishi.shosetsu-toukou-site.org
            lexis-novel-site.org
            www.lexis-novel-site.org
            renai.lexis-novel-site.org
            rekishi.lexis-novel-site.org;

        # SSL 証明書
        ssl_certificate     /etc/letsencrypt/live/shosetsu-toukou-site.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/shosetsu-toukou-site.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;

        set $novel_backend http://novel-backend:8000;
        set $novel_frontend http://novel-frontend:3000;

        # ===== 絶対に見せない系 =====
        # `.ht` を入れると `.html` まで巻き込むので、必要なものだけ列挙する
        location ~* /\.(?:env|git(?:ignore)?|htaccess|htpasswd|svn|DS_Store)$ {
            return 404;
        }

        # アプリ配布物は圧縮ファイルを許可する
        location ^~ /static/app_downloads/ {
            alias /static/app_downloads/;
            try_files $uri =404;
        }

        # `.git/` 配下はさらに強く遮断
        location ^~ /.git/ {
            return 404;
        }

        # バックアップやダンプっぽいのも遮断（任意）
        location ~* \.(?:sql|bak|old|zip|tar|gz)$ {
            return 404;
        }

        location /_next/ {
            proxy_pass $novel_frontend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 小説詳細は Next.js 側で SEO メタを生成する。エピソードは既存 prerender を維持する。
        location ~ ^/novels/[0-9]+$ {
            proxy_pass $novel_frontend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Bot には /episodes/:id を backend prerender HTML で返す
        location ~ ^/(novels|episodes)/[0-9]+$ {
            if ($is_search_bot) {
                proxy_pass $novel_backend/prerender$request_uri;
                break;
            }
            proxy_pass $novel_frontend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===== 静的画像 (挿絵など) =====
        # /static 配下は SPA にフォールバックせず実ファイルのみ返す
        location /static/ {
            alias /static/;
            try_files $uri =404;
        }

        location /uploads/ {
            alias /uploads/;
            try_files $uri =404;
        }

        # ===== OG/Twitter card 用の共有ページ =====
        # X などのクローラが /episodes/:id を取得すると SPA の index.html になりメタが取れないため、
        # /share/ 配下は backend で HTML を返してメタタグを提供する。
        location /share/ {
            proxy_pass $novel_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===== Sitemap =====
        location = /sitemap.xml {
            proxy_pass $novel_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # split sitemap endpoints
        location ~ ^/sitemap-(static|novels|episodes|authors|tags)\.xml$ {
            proxy_pass $novel_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # robots.txt is generated by backend per host (domain/subdomain aware)
        location = /robots.txt {
            proxy_pass $novel_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # IndexNow key file: /<INDEXNOW_KEY>.txt
        location ~ ^/[A-Za-z0-9_-]+\.txt$ {
            proxy_pass $novel_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Sitemap (main site) for apex domains when /sitemap.xml is a sitemapindex
        location = /sitemap-main.xml {
            proxy_pass $novel_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Optional sitemap index endpoint
        location = /sitemap-index.xml {
            proxy_pass $novel_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===== API → backend =====
        # AI 生成は応答まで時間がかかることがあるため、タイムアウトを長めに設定
        location = /api/ai/chat/generate_image {
            proxy_pass $novel_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 650s;
            proxy_read_timeout 650s;
        }

        location /api/ai/ {
            proxy_pass $novel_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        location /api/ {
            proxy_pass $novel_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===== favicon は index.html に巻き込まない =====
        location = /favicon.ico {
            proxy_pass $novel_frontend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
            log_not_found off;
        }

        # ===== Next.js app routing =====
        location / {
            proxy_pass $novel_frontend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===== Certbot 用 =====
        location /.well-known/acme-challenge/ {
            alias /var/www/certbot/.well-known/acme-challenge/;
        }
    }
}
