events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # FastAPI backend (コンテナ名 backend:8000)
    upstream backend {
        server backend:8000;
    }

    # ================================
    # HTTP → HTTPS redirect
    # ================================
    server {
        listen 80;
        server_name _ shosetsu-toukou-site.org www.shosetsu-toukou-site.org;
        return 301 https://$host$request_uri;
    }

    # ================================
    # HTTPS 本番サーバー
    # ================================
    server {
        listen 443 ssl;
        server_name _ shosetsu-toukou-site.org www.shosetsu-toukou-site.org;

        # SSL 証明書
        ssl_certificate     /etc/letsencrypt/live/shosetsu-toukou-site.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/shosetsu-toukou-site.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # React ビルド配置先
        root /usr/share/nginx/html;
        index index.html index.htm;

        # ===== React SPA ルーティング =====
        # index.html が存在しない時は 404 を返してループを防ぐ
        location / {
            try_files $uri /index.html =404;
        }

        # ===== API → backend =====
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===== favicon は index.html に巻き込まない =====
        location = /favicon.ico {
            try_files /favicon.ico =404;
            access_log off;
            log_not_found off;
        }

        # ===== Certbot 用 =====
        location /.well-known/acme-challenge/ {
            alias /var/www/certbot/.well-known/acme-challenge/;
        }
    }
}
