events {}

http {
    client_max_body_size 10M;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # FastAPI backend (コンテナ名 backend:8000)
    upstream novel-backend {
        server novel-backend:8000;
    }

    # ================================
    # HTTP → HTTPS redirect
    # ================================
    server {
        listen 80;
        server_name _ shosetsu-toukou-site.org www.shosetsu-toukou-site.org;
        return 301 https://$host$request_uri;
    }

    # ================================
    # HTTPS 本番サーバー
    # ================================
    server {
        listen 443 ssl;
        server_name _ shosetsu-toukou-site.org www.shosetsu-toukou-site.org;

        # SSL 証明書
        ssl_certificate     /etc/letsencrypt/live/shosetsu-toukou-site.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/shosetsu-toukou-site.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # React ビルド配置先
        root /usr/share/nginx/html;
        index index.html index.htm;

        # ===== 絶対に見せない系 =====
        # `.ht` を入れると `.html` まで巻き込むので、必要なものだけ列挙する
        location ~* /\.(?:env|git(?:ignore)?|htaccess|htpasswd|svn|DS_Store)$ {
            return 404;
        }

        # アプリ配布物は圧縮ファイルを許可する
        location ^~ /static/app_downloads/ {
            alias /static/app_downloads/;
            try_files $uri =404;
        }

        # `.git/` 配下はさらに強く遮断
        location ^~ /.git/ {
            return 404;
        }

        # バックアップやダンプっぽいのも遮断（任意）
        location ~* \.(?:sql|bak|old|zip|tar|gz)$ {
            return 404;
        }

        # ===== React SPA ルーティング =====
        # index.html が存在しない時は 404 を返してループを防ぐ
        location / {
            try_files $uri /index.html =404;
        }

        # ===== 静的画像 (挿絵など) =====
        # /static 配下は SPA にフォールバックせず実ファイルのみ返す
        location /static/ {
            alias /static/;
            try_files $uri =404;
        }

        # ===== OG/Twitter card 用の共有ページ =====
        # X などのクローラが /episodes/:id を取得すると SPA の index.html になりメタが取れないため、
        # /share/ 配下は backend で HTML を返してメタタグを提供する。
        location /share/ {
            proxy_pass http://novel-backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===== Sitemap =====
        location = /sitemap.xml {
            proxy_pass http://novel-backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===== API → backend =====
        # AI 生成は応答まで時間がかかることがあるため、タイムアウトを長めに設定
        location = /api/ai/chat/generate_image {
            proxy_pass http://novel-backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 650s;
            proxy_read_timeout 650s;
        }

        location /api/ai/ {
            proxy_pass http://novel-backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location /api/ {
            proxy_pass http://novel-backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===== favicon は index.html に巻き込まない =====
        location = /favicon.ico {
            try_files /favicon.ico =404;
            access_log off;
            log_not_found off;
        }

        # ===== Certbot 用 =====
        location /.well-known/acme-challenge/ {
            alias /var/www/certbot/.well-known/acme-challenge/;
        }
    }
}
