<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lexis Novel Desktop</title><link rel="stylesheet" href="./styles.css"></head><body>
<div class="actions" style="padding:12px 16px"><label>言語 / Language <select id="language"><option value="ja">日本語</option><option value="en">English</option><option value="ko">한국어</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="vi">Tiếng Việt</option></select></label><button id="navGenerate" class="primary">生成</button><button id="navLibrary">小説一覧</button><button onclick="location.href='./ai-chat.html'">AIチャット</button><button onclick="location.href='./consultation.html'">AI相談室</button></div>
<div id="generatorView"><main class="layout"><section class="panel"><h1>Lexis Novel Desktop</h1><p class="muted">OpenRouter対応 Windows 小説制作アプリ</p><div class="actions"><button id="updateApp">アップデート</button><button id="uninstallApp">アンインストール</button></div>
<label>OpenRouter APIキー<span class="muted">OpenRouterでAIモデルを利用するためのキーです。 <a href="https://openrouter.ai/settings/keys" target="_blank" rel="noopener noreferrer">OpenRouterでAPIキーを取得・管理</a></span><input id="apiKey" type="password" placeholder="sk-or-v1-..."></label>
<div class="row"><label class="grow">モデル<span class="muted">小説生成に使うAIモデルを指定します。迷った場合は openrouter/auto のままで使えます。</span><input id="model" value="openrouter/auto"></label><button id="loadModels">モデル取得</button></div><select id="modelList"><option value="">取得したモデルから選択</option></select>
<div class="grid2"><label>タイトルのイメージ<input id="titleHint"></label><label>ジャンル<input id="genre"></label></div><label>登場人物・設定<textarea id="characters" rows="6"></textarea></label><label>雰囲気<input id="tone"></label>
<div class="grid3"><label>長さ<select id="length"><option value="short">短編</option><option value="medium" selected>中編</option><option value="long">長め</option><option value="xlong">長編</option><option value="xxlong">超長編</option></select></label><label>最大トークン<input id="maxTokens" type="number" min="512" max="8192" value="4096"></label><label class="check"><input id="r18" type="checkbox"> R18モード</label></div><hr><h2>ブロック生成</h2><div class="grid2"><label>ブロック数<input id="blockCount" type="number" min="2" max="12" value="4"></label><label>1ブロック最大トークン<input id="blockMaxTokens" type="number" min="512" max="8192" value="2000"></label></div><label>再試行回数<input id="retryCount" type="number" min="0" max="100" value="20"></label><label>各ブロックの展開案</label><div id="blockPlanBoxes"></div><div class="actions"><button id="addBlockPlan" type="button">＋ ブロックを追加</button><button id="removeBlockPlan" type="button">－ ブロックを削除</button></div><div class="actions"><button id="saveSettings">設定保存</button><button id="saveTemplate">テンプレート保存</button><button id="generate" class="primary">通常生成</button><button id="generateBlocks" class="primary">ブロック生成</button></div><div id="status" class="status"></div></section>
<section class="panel result"><label>タイトル<input id="resultTitle"></label><label>本文<textarea id="resultBody" rows="28"></textarea></label><div class="actions"><button id="continueNovel">続きを生成</button><button id="saveLocal">オフライン保存</button><button id="saveNovel">TXT/Markdown保存</button><button id="refreshHistory">履歴</button></div><hr><h3>Lexisへアップロード</h3><div class="grid2"><label>Lexisユーザー名<input id="lexisUsername"></label><label>パスワード<input id="lexisPassword" type="password"></label></div><div class="actions"><button id="lexisLogin">Lexisログイン</button><button id="uploadLexis" class="primary">Lexisにアップロード</button></div><select id="drafts"><option value="">オフライン保存から読み込み</option></select><div id="meta" class="muted"></div><h3>生成ブロック</h3><div id="blocks"></div><h3>履歴 / テンプレート</h3><select id="history"><option>履歴を読み込み</option></select><select id="templates"><option>テンプレートを読み込み</option></select></section></main></div><section id="libraryView" class="panel" style="display:none;margin:0 16px 16px"><h2>生成した小説一覧</h2><div class="actions"><button id="replaceUntitledTitles">無題タイトルを置き換える</button></div><div id="libraryList"></div><div id="libraryDetail" style="display:none"><button id="libraryBack">← 一覧へ戻る</button><label>タイトル<input id="libraryTitleInput" disabled></label><textarea id="libraryBody" rows="28" style="width:100%" disabled></textarea><div class="actions"><button id="libraryBookmark">☆ ブックマーク</button><button id="libraryEdit">編集</button><button id="librarySaveEdit" class="primary" style="display:none">編集を保存</button><button id="libraryCancelEdit" style="display:none">キャンセル</button><button id="libraryUpload" class="primary">Lexis投稿</button><button id="libraryDownload">ダウンロード</button><button id="libraryDelete">削除</button></div><div id="libraryStatus" class="status"></div></div></section><script src="./app.js"></script></body></html>
