<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lexis Novel Desktop</title><link rel="stylesheet" href="./styles.css"></head><body>
<main class="layout"><section class="panel"><h1>Lexis Novel Desktop</h1><p class="muted">OpenRouter対応 Windows 小説制作アプリ</p><div class="actions"><button id="updateApp">アップデート</button><button id="uninstallApp">アンインストール</button></div>
<label>OpenRouter APIキー<input id="apiKey" type="password" placeholder="sk-or-v1-..."></label>
<div class="row"><label class="grow">モデル<input id="model" value="openrouter/auto"></label><button id="loadModels">モデル取得</button></div><select id="modelList"><option value="">取得したモデルから選択</option></select>
<div class="grid2"><label>タイトルのイメージ<input id="titleHint"></label><label>ジャンル<input id="genre"></label></div>
<label>登場人物・設定<textarea id="characters" rows="6"></textarea></label><label>雰囲気<input id="tone"></label>
<div class="grid3"><label>長さ<select id="length"><option value="short">短編</option><option value="medium" selected>中編</option><option value="long">長め</option><option value="xlong">長編</option><option value="xxlong">超長編</option></select></label><label>最大トークン<input id="maxTokens" type="number" min="512" max="8192" value="4096"></label><label class="check"><input id="r18" type="checkbox"> R18モード</label></div>
<hr><h2>ブロック生成</h2><div class="grid2"><label>ブロック数<input id="blockCount" type="number" min="2" max="12" value="4"></label><label>1ブロック最大トークン<input id="blockMaxTokens" type="number" min="512" max="8192" value="2000"></label></div>
<label>再試行回数<input id="retryCount" type="number" min="0" max="100" value="20"><span class="muted">空の応答や一時的な通信エラーが起きたときに、AI生成をやり直す回数です。初期値は20回です。</span></label><label>各ブロックの展開案</label><p class="muted">ブロックごとに内容を入力できます。下のボタンで追加できます。</p><div id="blockPlanBoxes"></div><button id="addBlockPlan" type="button">＋ ブロックを追加</button>
<div class="actions"><button id="saveSettings">設定保存</button><button id="saveTemplate">テンプレート保存</button><button id="generate" class="primary">通常生成</button><button id="generateBlocks" class="primary">ブロック生成</button></div><div id="status" class="status"></div></section>
<section class="panel result"><label>タイトル<input id="resultTitle"></label><label>本文<textarea id="resultBody" rows="28"></textarea></label><div class="actions"><button id="continueNovel">続きを生成</button><button id="saveLocal">オフライン保存</button><button id="saveNovel">TXT/Markdown保存</button><button id="refreshHistory">履歴</button></div><hr><h3>Lexisへアップロード</h3><div class="grid2"><label>Lexisユーザー名<input id="lexisUsername"></label><label>パスワード<input id="lexisPassword" type="password"></label></div><div class="actions"><button id="lexisLogin">Lexisログイン</button><button id="uploadLexis" class="primary">Lexisにアップロード</button></div><select id="drafts"><option value="">オフライン保存から読み込み</option></select><div id="meta" class="muted"></div><h3>生成ブロック</h3><div id="blocks"></div><h3>履歴 / テンプレート</h3><select id="history"><option>履歴を読み込み</option></select><select id="templates"><option>テンプレートを読み込み</option></select></section></main><script src="./app.js"></script></body></html>
