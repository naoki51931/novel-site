<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lexis AI相談室</title><link rel="stylesheet" href="./styles.css"><style>body{padding:18px}.chat{max-width:980px;margin:auto}.messages{height:55vh;overflow:auto;background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px}.msg{white-space:pre-wrap;margin:10px 0;padding:10px 12px;border-radius:10px}.user{background:#e8f1ff;margin-left:15%}.assistant{background:#f2f2f2;margin-right:15%}.composer{display:flex;gap:8px;margin-top:10px}.composer textarea{flex:1;min-height:90px}.top{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:10px}</style></head><body><main class="chat"><div class="actions"><button onclick="location.href='./index.html'">← 小説制作へ戻る</button></div><h1>AI相談室</h1><p class="muted">相談履歴はこのPC内に保存します。AIへの送信時だけOpenRouterへのインターネット接続が必要です。</p><div class="top"><input id="model" value="openrouter/auto" placeholder="OpenRouterモデル"><select id="thread"></select><button id="newThread">新しい相談</button></div><label class="check"><input id="adult" type="checkbox"> 成人向け相談モード（18歳以上）</label><label>空・JSON不正時の再試行回数 <input id="retryCount" type="number" min="0" max="100" value="20" style="width:90px"></label><div id="messages" class="messages"></div><div class="composer"><textarea id="input" placeholder="相談内容を入力"></textarea><button id="send" class="primary">送信</button></div><div id="status" class="status"></div></main><script src="./consultation.js"></script></body></html>
