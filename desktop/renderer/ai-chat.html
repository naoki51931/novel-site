<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lexis AIチャット</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fb;color:#182033}.wrap{max-width:900px;margin:auto;padding:20px}.row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #ccd2dc;border-radius:8px}input,select{flex:1;min-width:150px}textarea{width:100%;box-sizing:border-box;min-height:90px}button{cursor:pointer}.messages{background:#fff;border-radius:12px;padding:14px;min-height:360px;max-height:55vh;overflow:auto}.msg{margin:10px 0;padding:10px;border-radius:10px;white-space:pre-wrap}.user{background:#e8f1ff}.assistant{background:#f1f1f1}.actions{display:flex;gap:8px}.primary{background:#6c00f5;color:#fff}.status{color:#666;margin:8px 0}</style></head><body><div class="wrap"><h1>AIチャット</h1><div class="row"><input id="character" placeholder="キャラクター名"><input id="personality" placeholder="性格・設定"><select id="model"></select></div><div class="row"><label><input id="r18" type="checkbox"> 成人向け</label><select id="style"><option value="normal">通常</option><option value="daily">日常会話</option><option value="iq80_crude">くだけた会話</option></select><select id="length"><option value="normal">標準</option><option value="long">長め</option><option value="short">短め</option></select><button id="clear">履歴クリア</button><button onclick="location.href='./index.html'">小説生成へ</button></div><div id="messages" class="messages"></div><div id="status" class="status"></div><textarea id="input" placeholder="キャラクターに話しかける"></textarea><div class="actions"><button id="say" class="primary">セリフとして送信</button><button id="do">行動として送信</button><button id="auto">キャラに続けてもらう</button></div></div><script src="./ai-chat.js"></script></body></html>
