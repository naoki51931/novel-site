name: Verify Android PR 26
on:
  push:
    branches:
      - fix/novel-library-black-text
    paths:
      - "smaho-app/android/**"
      - ".github/workflows/verify-android-pr26.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smaho-app/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build Android debug APK
        run: gradle clean assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Lexis-Android-PR26-debug
          path: smaho-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
