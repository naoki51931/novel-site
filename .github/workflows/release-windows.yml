name: Build and Release Lexis Windows

on:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - ".github/workflows/release-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Read Windows app version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=windows-v$version" >> $env:GITHUB_OUTPUT
      - name: Set up Python for Windows icon generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate 256px Windows ICO from Lexis PNG
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          New-Item -ItemType Directory -Force desktop/build | Out-Null
          python -c "from PIL import Image; im = Image.open('frontend/public/favicon-512x512.png').convert('RGBA'); assert im.width >= 256 and im.height >= 256, 'Source icon too small'; im.save('desktop/build/lexis.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"
      - name: Build Windows installer and updater metadata
        working-directory: desktop
        run: npm run dist -- --publish never
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lexis-Windows-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          if-no-files-found: error
      - name: Collect existing Windows release files
        shell: pwsh
        run: |
          $files = @(Get-ChildItem desktop/dist -File | Where-Object { $_.Extension -in @('.exe', '.blockmap') -or $_.Name -eq 'latest.yml' } | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw "No Windows release assets found in desktop/dist" }
          $files | Set-Content -Path "$env:RUNNER_TEMP/windows-release-assets.txt"
          $files | ForEach-Object { Write-Host "Release asset: $_" }
      - name: Check whether Windows release already exists
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0
      - name: Create Windows GitHub release
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create $env:TAG `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Lexis Windows v$env:VERSION" `
            --generate-notes `
            $(Get-Content "$env:RUNNER_TEMP/windows-release-assets.txt")
      - name: Replace assets on existing Windows release
        if: steps.release.outputs.exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release upload $env:TAG `
            --repo $env:GITHUB_REPOSITORY `
            --clobber `
            $(Get-Content "$env:RUNNER_TEMP/windows-release-assets.txt")
