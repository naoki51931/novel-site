name: Build and Release Lexis Windows

on:
  push:
    branches:
      - feature/windows-openrouter-novel-app
    paths:
      - "desktop/**"
      - ".github/workflows/release-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Windows implementation branch
        uses: actions/checkout@v4
        with:
          ref: feature/windows-openrouter-novel-app

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Read Windows app version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=windows-v$version" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer and updater metadata
        working-directory: desktop
        run: npm run dist -- --publish never

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lexis-Windows-${{ steps.version.outputs.version }}
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          if-no-files-found: error

      - name: Publish Windows-only GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Lexis Windows v${{ steps.version.outputs.version }}
          target_commitish: feature/windows-openrouter-novel-app
          files: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          generate_release_notes: true
