name: Build and Release Lexis Windows

on:
  push:
    branches:
      - feature/windows-openrouter-novel-app
      - feature/native-ai-consultation-room
    paths:
      - "desktop/**"
      - ".github/workflows/release-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Read Windows app version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=windows-v$version" >> $env:GITHUB_OUTPUT
      - name: Build Windows installer and updater metadata
        working-directory: desktop
        run: npm run dist -- --publish never
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lexis-Windows-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          if-no-files-found: error
      - name: Check whether Windows release already exists
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0
      - name: Create Windows GitHub release
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create $env:TAG `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Lexis Windows v$env:VERSION" `
            --generate-notes `
            desktop/dist/*.exe desktop/dist/latest.yml desktop/dist/*.blockmap
      - name: Replace assets on existing Windows release
        if: steps.release.outputs.exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release upload $env:TAG `
            --repo $env:GITHUB_REPOSITORY `
            --clobber `
            desktop/dist/*.exe desktop/dist/latest.yml desktop/dist/*.blockmap
