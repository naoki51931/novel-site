name: Build and Release Lexis Android

on:
  push:
    branches:
      - feature/windows-openrouter-novel-app
    paths:
      - "smaho-app/android/**"
      - ".github/workflows/release-android.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smaho-app/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../../Lexis-Android.apk

      - name: Create GitHub Release and upload APK
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || '1.0.0' }}
        run: |
          TAG="android-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Lexis-Android.apk --clobber
          else
            gh release create "$TAG" Lexis-Android.apk --title "Lexis Android v${VERSION}" --notes "Lexis Android APK"
          fi

