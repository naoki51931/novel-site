name: NovelSiteMobile
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: 16.0

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.novelsite.mobile.ios
    SWIFT_VERSION: 5.9

configs:
  Debug: debug
  Release: release

targets:
  NovelSiteMobile:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSExceptionDomains:
          localhost:
            NSExceptionAllowsInsecureHTTPLoads: true
          127.0.0.1:
            NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: 1
