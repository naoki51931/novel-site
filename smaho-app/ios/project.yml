name: Lexis
options:
  bundleIdPrefix: com.novelsite
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  Lexis:
    type: application
    platform: iOS
    sources:
      - path: Lexis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novelsite.mobile.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lexis
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: AIへの画像添付に使用します。
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
