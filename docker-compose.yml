version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: novel-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novel-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID}

      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      BACKEND_ORIGIN: ${BACKEND_ORIGIN}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      X_OAUTH_CONSUMER_KEY: ${X_OAUTH_CONSUMER_KEY}
      X_OAUTH_CONSUMER_SECRET: ${X_OAUTH_CONSUMER_SECRET}

      FORCE_ALL_PREMIUM: "0"
      PREMIUM_REVALIDATE_DAYS: ${PREMIUM_REVALIDATE_DAYS}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL_TEXT: ${OPENAI_MODEL_TEXT}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_API_KEY_FILE: ${OPENROUTER_API_KEY_FILE}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_API_KEY_FILE: ${DEEPSEEK_API_KEY_FILE}

    volumes:
      - ./static:/app/static

    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: novel-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./static:/usr/share/nginx/html/static
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

      - ./nginx/ssl/letsencrypt:/etc/letsencrypt
      - ./nginx/ssl/www:/var/www/certbot

  certbot:
    image: certbot/certbot
    container_name: novel-certbot
    volumes:
      - ./nginx/ssl/letsencrypt:/etc/letsencrypt
      - ./nginx/ssl/www:/var/www/certbot
    entrypoint: /bin/sh -c "sleep infinity"

volumes:
  db-data:
