version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: novel-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: novel_db
      MYSQL_USER: novel_user
      MYSQL_PASSWORD: novel_pass
    ports:
      - "3307:3306"          # ホストから触りたいとき用（本番では消してOK）
    volumes:
      - db-data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novel-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: novel_user
      DB_PASS: novel_pass
      DB_NAME: novel_db
    depends_on:
      - db

  nginx:
    image: nginx:1.27-alpine
    container_name: novel-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro

volumes:
  db-data:
