version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: novel-db
    restart: unless-stopped
    environment:
      TZ: Asia/Tokyo
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novel-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Tokyo
      DB_HOST: db
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID}
      STRIPE_USE_TEST: ${STRIPE_USE_TEST:-0}
      STRIPE_TEST_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY}
      STRIPE_TEST_WEBHOOK_SECRET: ${STRIPE_TEST_WEBHOOK_SECRET}
      STRIPE_TEST_PRICE_ID: ${STRIPE_TEST_PRICE_ID}
      PLATFORM_FEE_RATE: ${PLATFORM_FEE_RATE}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      ADMIN_JWT_EXPIRES_MINUTES: ${ADMIN_JWT_EXPIRES_MINUTES}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE}

      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      BACKEND_ORIGIN: ${BACKEND_ORIGIN}
      SITE_KEY_DEFAULT: ${SITE_KEY_DEFAULT:-main}
      SITE_KEY_ALLOWED: ${SITE_KEY_ALLOWED:-main,romance,history}
      SITE_HOST_MAP_JSON: '${SITE_HOST_MAP_JSON:-{"shosetsu-toukou-site.org":"main","www.shosetsu-toukou-site.org":"main","renai.shosetsu-toukou-site.org":"romance","rekishi.shosetsu-toukou-site.org":"history","lexis-novel-site.org":"main","www.lexis-novel-site.org":"main","renai.lexis-novel-site.org":"romance","rekishi.lexis-novel-site.org":"history"}}'
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      X_OAUTH_CONSUMER_KEY: ${X_OAUTH_CONSUMER_KEY}
      X_OAUTH_CONSUMER_SECRET: ${X_OAUTH_CONSUMER_SECRET}

      FORCE_ALL_PREMIUM: "0"
      FORCE_PREMIUM_USERNAMES: ${FORCE_PREMIUM_USERNAMES}
      PREMIUM_REVALIDATE_DAYS: ${PREMIUM_REVALIDATE_DAYS}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      WEBPUSH_VAPID_PUBLIC_KEY: ${WEBPUSH_VAPID_PUBLIC_KEY}
      WEBPUSH_VAPID_PRIVATE_KEY: ${WEBPUSH_VAPID_PRIVATE_KEY}
      WEBPUSH_VAPID_SUBJECT: ${WEBPUSH_VAPID_SUBJECT}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      FIREBASE_SERVICE_ACCOUNT_FILE: ${FIREBASE_SERVICE_ACCOUNT_FILE}

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL_TEXT: ${OPENAI_MODEL_TEXT}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER}
      TRANSLATION_MODEL_TEXT: ${TRANSLATION_MODEL_TEXT}
      TRANSLATION_AI_TIMEOUT_SECONDS: ${TRANSLATION_AI_TIMEOUT_SECONDS}
      UI_I18N_JOB_HEARTBEAT_SECONDS: ${UI_I18N_JOB_HEARTBEAT_SECONDS}
      GOOGLE_CSE_API_KEY: ${GOOGLE_CSE_API_KEY}
      GOOGLE_CSE_CX: ${GOOGLE_CSE_CX}
      GOOGLE_INDEXING_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_INDEXING_SERVICE_ACCOUNT_EMAIL}
      GOOGLE_INDEXING_PRIVATE_KEY: ${GOOGLE_INDEXING_PRIVATE_KEY}
      GOOGLE_INDEXING_PRIVATE_KEY_ID: ${GOOGLE_INDEXING_PRIVATE_KEY_ID}
      GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON: ${GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON}
      GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON}
      GOOGLE_SEARCH_CONSOLE_SITE_URL: ${GOOGLE_SEARCH_CONSOLE_SITE_URL}
      RECAPTCHA_ENABLED: ${RECAPTCHA_ENABLED:-1}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY}
      VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY}
      RECAPTCHA_PROJECT_ID: ${RECAPTCHA_PROJECT_ID:-}
      RECAPTCHA_SERVICE_ACCOUNT_JSON: ${RECAPTCHA_SERVICE_ACCOUNT_JSON}
      RECAPTCHA_ENTERPRISE_ENABLED: ${RECAPTCHA_ENTERPRISE_ENABLED:-1}
      RECAPTCHA_MIN_SCORE: ${RECAPTCHA_MIN_SCORE:-0.3}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_API_KEY_FILE: ${OPENROUTER_API_KEY_FILE}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_API_KEY_FILE: ${DEEPSEEK_API_KEY_FILE}
      NOVELAI_API_KEY: ${NOVELAI_API_KEY}
      AI_CHAT_IMAGE_API_BASE_URL: ${AI_CHAT_IMAGE_API_BASE_URL}
      AI_CHAT_IMAGE_API_KEY: ${AI_CHAT_IMAGE_API_KEY}
      AI_CHAT_IMAGE_MODEL_ID: ${AI_CHAT_IMAGE_MODEL_ID}
      AI_CHAT_IMAGE_NEGATIVE_PROMPT: ${AI_CHAT_IMAGE_NEGATIVE_PROMPT}
      AI_CHAT_IMAGE_TIMEOUT_SEC: ${AI_CHAT_IMAGE_TIMEOUT_SEC}
      AI_CHAT_IMAGE_QUALITY_RETRY_ENABLED: ${AI_CHAT_IMAGE_QUALITY_RETRY_ENABLED}
      AI_CHAT_IMAGE_QUALITY_MIN_SCORE: ${AI_CHAT_IMAGE_QUALITY_MIN_SCORE}
      AI_CHAT_IMAGE_QUALITY_MAX_RETRIES: ${AI_CHAT_IMAGE_QUALITY_MAX_RETRIES}
      AI_CHAT_IMAGE_QUALITY_SAMPLE_SIZE: ${AI_CHAT_IMAGE_QUALITY_SAMPLE_SIZE}
      AI_CHAT_IMAGE_OOM_RETRY_ENABLED: ${AI_CHAT_IMAGE_OOM_RETRY_ENABLED}
      AI_CHAT_IMAGE_OOM_RETRY_SCALE: ${AI_CHAT_IMAGE_OOM_RETRY_SCALE}
      AI_CHAT_IMAGE_OOM_RETRY_STEPS: ${AI_CHAT_IMAGE_OOM_RETRY_STEPS}
      AI_CHAT_IMAGE_INIT_STRENGTH: ${AI_CHAT_IMAGE_INIT_STRENGTH}
      AI_CHAT_MEMORY_ENABLED: ${AI_CHAT_MEMORY_ENABLED:-1}
      AI_CHAT_MEMORY_TOPK: ${AI_CHAT_MEMORY_TOPK:-12}
      MONTHLY_STRIPE_PREMIUM_SYNC_DAY: ${MONTHLY_STRIPE_PREMIUM_SYNC_DAY:-5}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1}
      OPENAI_IMAGE_SIZE: ${OPENAI_IMAGE_SIZE:-1024x1536}
      OPENAI_IMAGE_QUALITY: ${OPENAI_IMAGE_QUALITY:-medium}
      OPENAI_IMAGE_FORMAT: ${OPENAI_IMAGE_FORMAT:-jpeg}
      COVER_UPLOAD_DIR: ${COVER_UPLOAD_DIR:-/app/uploads/covers}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://shosetsu-toukou-site.org}
      WEAVIATE_URL: ${WEAVIATE_URL:-http://weaviate:8080}
      WEAVIATE_TIMEOUT_SEC: ${WEAVIATE_TIMEOUT_SEC:-10}

    volumes:
      - ./static:/app/static
      - ./uploads:/app/uploads

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      weaviate:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: novel-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:1.27-alpine
    container_name: novel-nginx
    restart: unless-stopped
    environment:
      TZ: Asia/Tokyo
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./static:/static
      - ./uploads:/uploads
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

      - ./nginx/ssl/letsencrypt:/etc/letsencrypt
      - ./nginx/ssl/www:/var/www/certbot

  certbot:
    image: certbot/certbot
    container_name: novel-certbot
    volumes:
      - ./nginx/ssl/letsencrypt:/etc/letsencrypt
      - ./nginx/ssl/www:/var/www/certbot
    entrypoint: /bin/sh -c "sleep infinity"

  weaviate:
    image: semitechnologies/weaviate:1.24.8
    container_name: novel-weaviate
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: "20"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
    volumes:
      - weaviate_data:/var/lib/weaviate

volumes:
  db-data:
  weaviate_data:
  redis_data:
