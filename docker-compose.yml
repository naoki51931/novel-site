version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: novel-db
    restart: unless-stopped
    environment:
      TZ: Asia/Tokyo
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novel-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Tokyo
      DB_HOST: db
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID}
      PLATFORM_FEE_RATE: ${PLATFORM_FEE_RATE}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      ADMIN_JWT_EXPIRES_MINUTES: ${ADMIN_JWT_EXPIRES_MINUTES}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE}

      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      BACKEND_ORIGIN: ${BACKEND_ORIGIN}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      X_OAUTH_CONSUMER_KEY: ${X_OAUTH_CONSUMER_KEY}
      X_OAUTH_CONSUMER_SECRET: ${X_OAUTH_CONSUMER_SECRET}

      FORCE_ALL_PREMIUM: "0"
      PREMIUM_REVALIDATE_DAYS: ${PREMIUM_REVALIDATE_DAYS}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      WEBPUSH_VAPID_PUBLIC_KEY: ${WEBPUSH_VAPID_PUBLIC_KEY}
      WEBPUSH_VAPID_PRIVATE_KEY: ${WEBPUSH_VAPID_PRIVATE_KEY}
      WEBPUSH_VAPID_SUBJECT: ${WEBPUSH_VAPID_SUBJECT}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      FIREBASE_SERVICE_ACCOUNT_FILE: ${FIREBASE_SERVICE_ACCOUNT_FILE}

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL_TEXT: ${OPENAI_MODEL_TEXT}
      GOOGLE_CSE_API_KEY: ${GOOGLE_CSE_API_KEY}
      GOOGLE_CSE_CX: ${GOOGLE_CSE_CX}
      GOOGLE_INDEXING_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_INDEXING_SERVICE_ACCOUNT_EMAIL}
      GOOGLE_INDEXING_PRIVATE_KEY: ${GOOGLE_INDEXING_PRIVATE_KEY}
      GOOGLE_INDEXING_PRIVATE_KEY_ID: ${GOOGLE_INDEXING_PRIVATE_KEY_ID}
      GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON: ${GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON}
      GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON}
      GOOGLE_SEARCH_CONSOLE_SITE_URL: ${GOOGLE_SEARCH_CONSOLE_SITE_URL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_API_KEY_FILE: ${OPENROUTER_API_KEY_FILE}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_API_KEY_FILE: ${DEEPSEEK_API_KEY_FILE}
      NOVELAI_API_KEY: ${NOVELAI_API_KEY}
      AI_CHAT_IMAGE_API_BASE_URL: ${AI_CHAT_IMAGE_API_BASE_URL}
      AI_CHAT_IMAGE_API_KEY: ${AI_CHAT_IMAGE_API_KEY}
      AI_CHAT_IMAGE_MODEL_ID: ${AI_CHAT_IMAGE_MODEL_ID}
      AI_CHAT_IMAGE_NEGATIVE_PROMPT: ${AI_CHAT_IMAGE_NEGATIVE_PROMPT}
      AI_CHAT_IMAGE_TIMEOUT_SEC: ${AI_CHAT_IMAGE_TIMEOUT_SEC}
      AI_CHAT_IMAGE_QUALITY_RETRY_ENABLED: ${AI_CHAT_IMAGE_QUALITY_RETRY_ENABLED}
      AI_CHAT_IMAGE_QUALITY_MIN_SCORE: ${AI_CHAT_IMAGE_QUALITY_MIN_SCORE}
      AI_CHAT_IMAGE_QUALITY_MAX_RETRIES: ${AI_CHAT_IMAGE_QUALITY_MAX_RETRIES}
      AI_CHAT_IMAGE_QUALITY_SAMPLE_SIZE: ${AI_CHAT_IMAGE_QUALITY_SAMPLE_SIZE}
      AI_CHAT_IMAGE_OOM_RETRY_ENABLED: ${AI_CHAT_IMAGE_OOM_RETRY_ENABLED}
      AI_CHAT_IMAGE_OOM_RETRY_SCALE: ${AI_CHAT_IMAGE_OOM_RETRY_SCALE}
      AI_CHAT_IMAGE_OOM_RETRY_STEPS: ${AI_CHAT_IMAGE_OOM_RETRY_STEPS}
      AI_CHAT_IMAGE_INIT_STRENGTH: ${AI_CHAT_IMAGE_INIT_STRENGTH}

    volumes:
      - ./static:/app/static

    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: novel-nginx
    restart: unless-stopped
    environment:
      TZ: Asia/Tokyo
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./static:/static
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

      - ./nginx/ssl/letsencrypt:/etc/letsencrypt
      - ./nginx/ssl/www:/var/www/certbot

  certbot:
    image: certbot/certbot
    container_name: novel-certbot
    volumes:
      - ./nginx/ssl/letsencrypt:/etc/letsencrypt
      - ./nginx/ssl/www:/var/www/certbot
    entrypoint: /bin/sh -c "sleep infinity"

volumes:
  db-data:
